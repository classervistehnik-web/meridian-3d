<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script
    type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      overflow: hidden;
    }

    model-viewer {
      width: 100%;
      height: 100vh;
      background: #ffffff;
    }
  </style>
</head>

<body>

  <model-viewer
    src="./Meshy_AI_Industrial_Hopper_and_0731151633_texture-v2.glb"
    camera-controls
    auto-rotate
    auto-rotate-delay="1000"
    rotation-per-second="10deg"
    shadow-intensity="1"
    shadow-softness="1"
    exposure="1"
    interaction-prompt="auto"
    touch-action="pan-y"
    camera-orbit="45deg 75deg auto"
    min-camera-orbit="auto auto 50%"
    max-camera-orbit="auto auto 300%">
  </model-viewer>

</body>
</html>
